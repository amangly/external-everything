[package]
name = "external-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
hyperrev-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
imgui = "0.12"
windows = { version = "0.58", features = [
    "Foundation_Numerics", "Win32_Foundation",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls", "Win32_UI_HiDpi",
] }
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }
