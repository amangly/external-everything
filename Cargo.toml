[workspace]
members = ["apps/desktop", "crates/hyperrev-transport", "crates/external-runtime"]
exclude = ["vendor/hyper-reV/loader"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
hyperrev-loader = { path = "vendor/hyper-reV/loader" }
hyperrev-transport = { path = "crates/hyperrev-transport" }
external-runtime = { path = "crates/external-runtime" }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
